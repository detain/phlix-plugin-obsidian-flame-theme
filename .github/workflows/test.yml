name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      # There is deliberately NO coverage-upload step here. The former
      # "Upload coverage to Codacy" step (deleted 2026-10-29) was theater: it
      # referenced secrets.CODACY_API_TOKEN — a secret this repository has
      # never carried — and this phpunit.xml has never configured a cobertura
      # report, so the step failed on every single CI run (verified in origin
      # run 39371976009: "Invalid configuration: Either a project or account
      # API token must be provided", exit code 1) while continue-on-error:
      # true kept the badge green. Do not re-add a masked, always-failing
      # telemetry step: either wire a real Codacy project and its secret and
      # upload without continue-on-error, or ship no step and claim nothing.

      # -c phpstan.neon (not `analyse src`) so scanDirectories picks up the
      # dev-stub for the host-only Phlix\Theming\ThemeSourceInterface.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      # --standard=phpcs.xml (not `phpcs src`) so tests/ and dev-stubs/ are checked too.
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml

  # S440 (finishing S246) — this repository had NO security audit gate at all: no
  # committed lock, no script, no CI leg. On 2026-08-06 a HIGH advisory
  # (CVE-2026-67434, OS command injection, GHSA-hmqg-cxww-wqhq) landed against
  # squizlabs/php_codesniffer — which this plugin pins in require-dev — and
  # nothing here would ever have said so. The sibling repos that DID have a gate
  # ran `composer audit --no-dev`, which drops every development dependency from
  # the audited set and so could not fail on it either.
  #
  # This job audits the WHOLE lock — runtime and development — and prints the
  # corpus it examined. Read scripts/security-audit-check.php for the policy and
  # its reasoning.
  #
  # Do NOT add a development-dependency exclusion, do NOT add continue-on-error
  # to the step below, and do NOT wrap it in a conditional: the reference
  # implementation (phlix-plugin-sample-theme) ships a guard test,
  # tests/SecurityAuditCheckTest.php, that parses this workflow and fails on each
  # of those edits — the same law applies to this port.
  #
  # Keep this job LAST in the file — the reference guard test slices the workflow
  # from `composer-audit:` to the end and asserts the slice is not neutered.
  composer-audit:
    name: Security Audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60
        with:
          php-version: '8.3'
          tools: composer:v2

      # `--locked` audits composer.lock and needs no vendor/, so there is
      # deliberately no `composer install` step here.
      - name: Run Security Audit (runtime AND development dependencies)
        run: php scripts/security-audit-check.php
